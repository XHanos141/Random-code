<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sliding Pill Selector — Component Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --timeframe-bg: #ffffff;
    --timeframe-text: #6b6c5e;
    --line: #ececec;
  }
  html[data-theme="dark"] {
    --timeframe-bg: #112033;
    --timeframe-text: #c2ccda;
    --line: rgba(255,255,255,0.08);
  }
  body { margin: 0; padding: 40px 16px; background: #dfe4ea; font-family: sans-serif; }
  html[data-theme="dark"] body { background: #0c1420; }

  /* ================= COMPONENT: SLIDING PILL SELECTOR ================= */

  .ui-control { position: absolute; opacity: 0; pointer-events: none; }

  .timeframe-wrap {
    background: var(--timeframe-bg); border-bottom: 1px solid var(--line);
    padding: 10px 14px 12px; transition: background 0.35s ease, border-color 0.35s ease;
    position: relative; z-index: 10; border-radius: 14px;
  }
  .timefilter { overflow-x: auto; scrollbar-width: none; }
  .timefilter::-webkit-scrollbar { display: none; }
  .timefilter-track {
    position: relative; display: inline-flex; gap: 6px; padding: 4px;
    border-radius: 999px; min-width: 100%; justify-content: center; align-items: center;
    background: rgba(0,0,0,0.03);
    border: 1px solid rgba(0,0,0,0.05);
    box-shadow:
      inset 0 1px 3px rgba(0,0,0,0.07),
      inset 0 1px 1px rgba(0,0,0,0.04),
      inset 0 -1px 1px rgba(255,255,255,0.7),
      0 1px 0 rgba(255,255,255,0.5);
  }
  html[data-theme="dark"] .timefilter-track {
    background: rgba(0,0,0,0.28);
    border-color: rgba(255,255,255,0.03);
    box-shadow:
      inset 0 1px 4px rgba(0,0,0,0.4),
      inset 0 1px 2px rgba(0,0,0,0.25),
      inset 0 -1px 1px rgba(255,255,255,0.02),
      0 1px 0 rgba(255,255,255,0.03);
  }

  /* the sliding indicator that moves behind the active pill */
  .timeframe-indicator {
    position: absolute; top: 4px; left: 0; height: calc(100% - 8px);
    border-radius: 999px; pointer-events: none;
    background: linear-gradient(180deg, #1f3d5e 0%, #001f3c 55%, #001426 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.20),
      inset 0 -1px 0 rgba(0,0,0,0.35),
      inset 1px 0 0 rgba(255,255,255,0.07),
      inset -1px 0 0 rgba(255,255,255,0.07),
      0 3px 10px rgba(0,31,60,0.45),
      0 1px 3px rgba(0,0,0,0.25),
      0 0 0 0.5px rgba(0,0,0,0.18);
    transition:
      transform 0.55s cubic-bezier(0.4,0,0.2,1),
      width 0.55s cubic-bezier(0.4,0,0.2,1),
      background 0.3s ease, box-shadow 0.3s ease;
  }
  .timeframe-indicator::after {
    content: ''; position: absolute; top: 2px; left: 10%; right: 10%; height: 42%;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 100%);
    pointer-events: none;
  }
  html[data-theme="dark"] .timeframe-indicator {
    background: linear-gradient(180deg, #8591ff 0%, #6f7cff 50%, #5560ef 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.35),
      inset 0 -1px 0 rgba(0,0,0,0.35),
      inset 1px 0 0 rgba(255,255,255,0.1),
      inset -1px 0 0 rgba(255,255,255,0.1),
      0 0 14px rgba(111,124,255,0.55),
      0 4px 16px rgba(111,124,255,0.40),
      0 2px 4px rgba(0,0,0,0.4),
      0 0 0 0.5px rgba(111,124,255,0.6);
  }
  html[data-theme="dark"] .timeframe-indicator::after {
    background: linear-gradient(180deg, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0) 100%);
  }

  /* inactive pill look */
  .tf {
    position: relative; z-index: 1;
    background: linear-gradient(180deg, rgba(255,255,255,0.90) 0%, rgba(255,255,255,0.68) 45%, rgba(220,228,242,0.60) 100%);
    border: 1px solid rgba(255,255,255,0.88);
    border-bottom-color: rgba(0,0,0,0.07);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,1),
      inset 0 -1px 0 rgba(0,0,0,0.05),
      0 1px 3px rgba(0,0,0,0.07),
      0 0 0 0.5px rgba(0,0,0,0.03);
    color: var(--timeframe-text);
    font-family: "Plus Jakarta Sans", sans-serif; font-size: 11px; font-weight: 700;
    padding: 8px 14px; border-radius: 999px; white-space: nowrap; cursor: pointer;
    transition: color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    user-select: none; touch-action: manipulation; outline: none;
    -webkit-tap-highlight-color: transparent;
    text-align: center;
  }
  html[data-theme="dark"] .tf {
    background: linear-gradient(180deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.04) 50%, rgba(255,255,255,0.02) 100%);
    border-color: rgba(255,255,255,0.1);
    border-bottom-color: rgba(0,0,0,0.2);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.12),
      inset 0 -1px 0 rgba(0,0,0,0.18),
      0 1px 2px rgba(0,0,0,0.25);
  }
  /* active pill: text goes white, own background disappears (indicator shows through) */
  .tf-option:checked + .tf { color: #ffffff; background: transparent; border-color: transparent; box-shadow: none; }
</style>
</head>
<body>

  <!-- ================= MARKUP ================= -->
  <!-- Swap labels/ids/count freely — 2 to 5+ pills all work, width is automatic -->
  <div class="timeframe-wrap">
    <div class="timefilter">
      <div class="timefilter-track" id="timeframeTrack">
        <input class="ui-control tf-option" type="radio" name="timeframe" id="tf-today">
        <label class="tf" for="tf-today">Today</label>

        <input class="ui-control tf-option" type="radio" name="timeframe" id="tf-week">
        <label class="tf" for="tf-week">This Week</label>

        <input class="ui-control tf-option" type="radio" name="timeframe" id="tf-month" checked>
        <label class="tf" for="tf-month">This Month</label>

        <input class="ui-control tf-option" type="radio" name="timeframe" id="tf-quarter">
        <label class="tf" for="tf-quarter">Last 3 Months</label>

        <div class="timeframe-indicator" id="timeframeIndicator"></div>
      </div>
    </div>
  </div>

<script>
  // Positions/resizes the sliding indicator to sit exactly behind whichever pill is checked.
  function positionIndicator(animate) {
    var indicator = document.getElementById('timeframeIndicator');
    var track = document.getElementById('timeframeTrack');
    var checked = document.querySelector('input[name="timeframe"]:checked');
    if (!indicator || !track || !checked) return;
    var label = checked.nextElementSibling;
    if (!label) return;
    var trackRect = track.getBoundingClientRect();
    var labelRect = label.getBoundingClientRect();
    if (!animate) { indicator.style.transition = 'none'; }
    indicator.style.width = labelRect.width + 'px';
    indicator.style.transform = 'translateX(' + Math.round(labelRect.left - trackRect.left) + 'px)';
    if (!animate) { requestAnimationFrame(function() { indicator.style.transition = ''; }); }
  }
  requestAnimationFrame(function() { positionIndicator(false); });
  window.addEventListener('resize', function() { positionIndicator(false); });
  // Re-run on every pill click so the indicator slides to the new selection.
  document.querySelectorAll('input[name="timeframe"]').forEach(function(input) {
    input.addEventListener('change', function() { positionIndicator(true); });
  });
</script>

</body>
</html>
