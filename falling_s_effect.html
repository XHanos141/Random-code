*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  min-height:100vh;
  overflow:hidden;
  position:relative;
}

/* ===== AMBIENT S-MARK FIELD ===== */
.capsule-field{
  position:fixed;top:0;left:0;right:0;bottom:0;
  overflow:hidden;pointer-events:none;z-index:0;
}
.capsule{
  position:absolute;top:-60px;
  width:26px;height:26px;
  background-color:var(--accent);
  opacity:0.10;
  -webkit-mask-image:var(--sv-mark);-webkit-mask-size:contain;-webkit-mask-repeat:no-repeat;-webkit-mask-position:center;
  mask-image:var(--sv-mark);mask-size:contain;mask-repeat:no-repeat;mask-position:center;
  filter:blur(0.3px);
  animation:capsuleFall linear infinite;
  will-change:transform;
}
@keyframes capsuleFall{
  0%{transform:translateY(0) rotate(0deg);}
  100%{transform:translateY(calc(100vh + 120px)) rotate(var(--rot));}
}
</style>
</head>
<body>

<div class="capsule-field" id="capsuleField"></div>

<script>
const field = document.getElementById('capsuleField');
const CAPSULE_COUNT = 8;
for (let i = 0; i < CAPSULE_COUNT; i++) {
  const c = document.createElement('div');
  c.className = 'capsule';
  const left = Math.random() * 100;
  const dur = 18 + Math.random() * 14;
  const delay = -Math.random() * dur; // negative delay = starts mid-animation, avoids a "spawn burst"
  const rot = 15 + Math.random() * 25;
  c.style.left = left + 'vw';
  c.style.animationDuration = dur + 's';
  c.style.animationDelay = delay + 's';
  c.style.setProperty('--rot', rot + 'deg');
  field.appendChild(c);
}
</script>
</body>
