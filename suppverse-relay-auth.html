<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SuppVerseBD Relay — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
<style id="theme-dark">
:root{
  --bg:#1a1f29; --shadow-d:#12161e; --shadow-l:#242c3a;
  --text:#f2f5fb; --dim:#b4c0d4; --faint:#8393ab;
  --brand:#a79dff; --brand-soft:rgba(167,157,255,.16);
}
</style>
<style id="theme-light" disabled>
:root{
  --bg:#e6e9ef; --shadow-d:#b8bec9; --shadow-l:#ffffff;
  --text:#1a2030; --dim:#465269; --faint:#5b657b;
  --brand:#5645d1; --brand-soft:rgba(86,69,209,.12);
}
</style>
<style>
:root{
  --r-lg:30px; --r-md:18px;
  --sh-out-sm:3px 3px 5px var(--shadow-d),-3px -3px 5px var(--shadow-l);
  --sh-out-md:6px 6px 8px var(--shadow-d),-6px -6px 8px var(--shadow-l);
  --sh-out-lg:10px 10px 12px var(--shadow-d),-10px -10px 12px var(--shadow-l);
  --sh-in-sm:inset 3px 3px 5px var(--shadow-d),inset -3px -3px 5px var(--shadow-l);
  --sh-in-md:inset 4px 4px 6px var(--shadow-d),inset -4px -4px 6px var(--shadow-l);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;padding:32px 20px;transition:background-color .35s,color .35s;}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0;}

.themebtn{position:fixed;top:18px;right:18px;width:36px;height:36px;border-radius:12px;background:var(--bg);box-shadow:var(--sh-out-sm);display:flex;align-items:center;justify-content:center;color:var(--dim);}
.themebtn:active{box-shadow:var(--sh-in-sm);}
.themebtn svg{width:16px;height:16px;}

.card{width:100%;max-width:360px;background:var(--bg);border-radius:var(--r-lg);padding:36px 28px 30px;box-shadow:var(--sh-out-lg);text-align:center;}

.tabs{display:flex;gap:8px;background:var(--bg);border-radius:14px;box-shadow:var(--sh-in-sm);padding:5px;margin-bottom:26px;}
.tab{flex:1;padding:9px 0;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--dim);transition:box-shadow .2s,color .2s;}
.tab.on{background:var(--bg);box-shadow:var(--sh-out-sm);color:var(--brand);}

.avatar{width:78px;height:78px;margin:0 auto 18px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-out-md);}
.avatar svg{width:34px;height:34px;color:var(--brand);}

h1{font-family:'Plus Jakarta Sans';font-weight:800;font-size:21px;margin:0 0 4px;letter-spacing:-.01em;}
.subtitle{font-size:12.5px;font-weight:600;color:var(--dim);margin:0 0 26px;}

.field{display:flex;align-items:center;gap:11px;height:52px;padding:0 17px;border-radius:15px;background:var(--bg);box-shadow:var(--sh-in-sm);margin-bottom:14px;}
.field svg{width:17px;height:17px;flex-shrink:0;color:var(--brand);}
.field input{flex:1;border:none;background:transparent;outline:none;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--text);min-width:0;}
.field input::placeholder{color:var(--faint);font-weight:600;}
.eye{background:none;border:none;padding:0;display:flex;color:var(--dim);cursor:pointer;flex-shrink:0;}
.eye svg{width:17px;height:17px;}

.row{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 22px;}
.remember{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;}
.remember span{font-size:12px;font-weight:600;color:var(--dim);}
.toggle{width:38px;height:22px;border-radius:11px;background:var(--bg);box-shadow:var(--sh-in-sm);position:relative;flex-shrink:0;}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--bg);box-shadow:var(--sh-out-sm);transition:transform .22s ease,background .2s;}
.toggle.on::after{transform:translateX(16px);background:var(--brand);box-shadow:none;}
.forgot{font-size:12px;font-weight:700;color:var(--brand);cursor:pointer;}

.terms{display:flex;align-items:flex-start;gap:9px;margin:2px 2px 22px;text-align:left;cursor:pointer;user-select:none;}
.checkbox{width:19px;height:19px;border-radius:6px;background:var(--bg);box-shadow:var(--sh-in-sm);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;}
.checkbox svg{width:12px;height:12px;color:var(--brand);opacity:0;transition:opacity .15s;}
.checkbox.on svg{opacity:1;}
.terms span{font-size:11.5px;font-weight:600;color:var(--dim);line-height:1.4;}
.terms a{color:var(--text);font-weight:700;}

.submit{width:100%;height:54px;border-radius:16px;background:var(--bg);color:var(--brand);font-family:inherit;font-size:13.5px;font-weight:800;letter-spacing:1.2px;box-shadow:var(--sh-out-md);transition:box-shadow .15s,transform .15s;}
.submit:active{box-shadow:var(--sh-in-md);transform:scale(.99);}

.switch{margin:20px 0 0;font-size:12px;font-weight:600;color:var(--faint);}
.switch button{color:var(--text);font-weight:800;text-decoration:underline;cursor:pointer;}

.socials{display:flex;justify-content:center;gap:10px;margin-top:18px;}
.social{width:38px;height:38px;border-radius:12px;background:var(--bg);box-shadow:var(--sh-out-sm);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:var(--dim);}
.social:active{box-shadow:var(--sh-in-sm);}

.pane{display:none;} .pane.on{display:block;animation:fade .3s ease both;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}}
</style>
</head>
<body>

<button class="themebtn" id="themeBtn" aria-label="Toggle theme">
  <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>

<div class="card">
  <div class="tabs">
    <button class="tab on" data-tab="login">Login</button>
    <button class="tab" data-tab="signup">Sign up</button>
  </div>

  <div class="avatar" id="avatar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
  </div>

  <!-- LOGIN -->
  <div class="pane on" id="pane-login">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to manage the relay</p>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" opacity="0"/><path d="m22 6-10 7L2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
      <input type="email" inputmode="email" autocomplete="email" placeholder="Email address">
    </div>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <input id="pw1" type="password" autocomplete="current-password" placeholder="Password">
      <button class="eye" data-pw="pw1" aria-label="Show or hide password" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <div class="row">
      <div class="remember" id="rememberRow"><div class="toggle" id="rememberToggle"></div><span>Remember me</span></div>
      <button class="forgot">Forgot?</button>
    </div>
    <button class="submit">LOGIN</button>
    <p class="switch">Don't have an account? <button data-goto="signup">Sign up</button></p>
    <div class="socials">
      <div class="social">G</div><div class="social">f</div><div class="social">in</div>
    </div>
  </div>

  <!-- SIGNUP -->
  <div class="pane" id="pane-signup">
    <h1>Create account</h1>
    <p class="subtitle">Set up access to the relay</p>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      <input type="text" autocomplete="name" placeholder="Full name">
    </div>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 6-10 7L2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
      <input type="email" inputmode="email" autocomplete="email" placeholder="Email address">
    </div>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <input id="pw2" type="password" autocomplete="new-password" placeholder="Password">
      <button class="eye" data-pw="pw2" aria-label="Show or hide password" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <input id="pw3" type="password" autocomplete="new-password" placeholder="Confirm password">
      <button class="eye" data-pw="pw3" aria-label="Show or hide password" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <div class="terms" id="termsRow">
      <div class="checkbox" id="termsBox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <span>I agree to the <a href="#">Terms &amp; Conditions</a></span>
    </div>
    <button class="submit">SIGN UP</button>
    <p class="switch">Already have an account? <button data-goto="login">Log in</button></p>
  </div>
</div>

<script>
const SUN='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const MOON='<path d="M21 12.5A9 9 0 1 1 11.5 3a7 7 0 0 0 9.5 9.5z"/>';
let currentTheme='dark';
function applyTheme(m){
  document.getElementById('theme-dark').disabled = (m==='light');
  document.getElementById('theme-light').disabled = (m!=='light');
  document.getElementById('themeIcon').innerHTML=m==='light'?MOON:SUN;
  currentTheme=m;
  try{localStorage.setItem('relay-theme',m);}catch(e){}
}
try{applyTheme(localStorage.getItem('relay-theme')||'dark');}catch(e){applyTheme('dark');}
document.getElementById('themeBtn').addEventListener('click',()=>{
  applyTheme(currentTheme==='light'?'dark':'light');
});

const LOCK='<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>';
const PERSON='<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/>';
function goto(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));
  document.getElementById('pane-login').classList.toggle('on',tab==='login');
  document.getElementById('pane-signup').classList.toggle('on',tab==='signup');
  document.getElementById('avatar').querySelector('svg').innerHTML = tab==='login'?LOCK:PERSON;
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>goto(t.dataset.tab)));
document.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click',()=>goto(b.dataset.goto)));

document.querySelectorAll('.eye').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const inp=document.getElementById(btn.dataset.pw);
    inp.type = inp.type==='password'?'text':'password';
  });
});

document.getElementById('rememberRow').addEventListener('click',()=>document.getElementById('rememberToggle').classList.toggle('on'));
document.getElementById('termsRow').addEventListener('click',()=>document.getElementById('termsBox').classList.toggle('on'));
</script>
</body>
</html>
